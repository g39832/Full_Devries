<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="login.css">
  <title>Devries Brothers Login</title>
</head>
<body>
  <header id="head">
    <h1 id="login-title">Devries Brothers</h1>
  </header>

  <div class="container">
    <img src="devires_pic.png" alt="Devries logo" id="logo_login">
    <h2>Client Info Page</h2>

    <!-- Login Form -->
    <form id="loginForm">
      <div id="password_field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
      <div class="buttons">
        <button type="submit" id="login-btn">Submit</button>
        <button type="button" id="show-change-btn">Change Password</button>
      </div>
    </form>

    <!-- Change Password Form -->
    <form id="changeForm" class="hidden">
      <div id="change_field">
        <label for="currentPwd">Current Password</label>
        <input type="password" id="currentPwd" placeholder="Current password" required>
        <label for="newPwd">New Password</label>
        <input type="password" id="newPwd" placeholder="New password" required>
        <label for="confirmPwd">Confirm New Password</label>
        <input type="password" id="confirmPwd" placeholder="Confirm new password" required>
      </div>
      <div class="buttons">
        <button type="submit" id="change-btn">Update Password</button>
        <button type="button" id="cancel-change-btn">Cancel</button>
      </div>
    </form>
  </div>

  <script src="auth-renderer.js"></script>
</body>
</html>
