<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Roofing CRM</title>
  <link rel="stylesheet" href="login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
</head>
<body>

  <div class="login-shell">
    <div class="login-orb orb-one"></div>
    <div class="login-orb orb-two"></div>

    <div class="container">
      <div class="brand-block">
        <img id="logo_login" src="assets/devries_pic.png" alt="DeVries Roofing logo">
        <div class="brand-copy">
          <div class="brand-kicker">Roofing CRM</div>
          <h1>Welcome back</h1>
          <p>Sign in with your Google account to manage clients, finance, and project details.</p>
        </div>
      </div>

    <button type="button" id="googleLoginBtn" class="google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C41.2 36 44 30.5 44 24c0-1.3-.1-2.6-.4-3.9z"/>
      </svg>
      <span>Continue with Google</span>
    </button>
    <p id="googleError" class="google-error" style="display:none; color:#ff9aa2; font-size:0.85rem; margin-top:8px; text-align:center;"></p>
    <p style="text-align:center; margin-top:16px; color:#53657d; font-size:0.85rem;">Everyone signs in with their company Google account.</p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
