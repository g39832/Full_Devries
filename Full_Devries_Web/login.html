<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roofing CRM - Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="container">
    <!-- Logo -->
    <img src="assets/devires_pic.png" alt="Logo" id="logo_login">

    <!-- Form Heading -->
    <h2>Login</h2>

    <!-- Login Form -->
    <form id="loginForm">
      <div>
        <input type="password" id="password" placeholder="Enter Password" required>
      </div>

      <!-- Buttons -->
      <div class="buttons">
        <button type="submit" id="login-btn">Login</button>
        <button type="button" id="show-change-btn">Reset</button>
      </div>
    </form>
  </div>

  <!-- Login JS -->
  <script src="login.js" defer></script>
</body>
</html>
