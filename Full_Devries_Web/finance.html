<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance - Dashboard</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body.dashboard-body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
     background: linear-gradient(135deg, #162447, #162447);
      display: flex;
      flex-direction: column;
    }

    /* ================= HEADER ================= */
    header#Main_header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      background: linear-gradient(90deg, #343a40, #343a40);
      color: white;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #toggleClientsBtn {
      background: white;
      color: #1e3c72;
      border: none;
      padding: 8px 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #toggleClientsBtn:hover {
      background: #f1f1f1;
      transform: translateY(-2px);
    }

    /* ================= LAYOUT ================= */
    .finance-container {
      padding: 35px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .section {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.06);
    }

    .section h3 {
      margin-bottom: 20px;
      font-size: 1.3rem;
      font-weight: 600;
      color: #1e3c72;
    }

    /* ================= YEAR INPUT ================= */
    #finance-year {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #d0d7de;
      margin-bottom: 15px;
      font-weight: 600;
      width: 120px;
    }

    #finance-year:focus {
      outline: none;
      border-color: #2a5298;
      box-shadow: 0 0 0 2px rgba(42,82,152,0.15);
    }

    /* ================= METRICS TABLE ================= */
    .metrics-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 14px;
      overflow: hidden;
    }

    .metrics-table th {
      background: #1e3c72;
      color: white;
      padding: 16px;
      font-weight: 600;
      text-align: left;
    }

    .metrics-table td {
      padding: 16px;
      background: #f9fbfd;
      font-weight: 600;
      border-bottom: 1px solid #e3e8ee;
    }

    .metrics-table input {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #d0d7de;
      font-weight: 600;
    }

    .metrics-table input:focus {
      outline: none;
      border-color: #2a5298;
      box-shadow: 0 0 0 2px rgba(42,82,152,0.15);
    }

    button {
      transition: all 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    /* ================= TAX GROUPS ================= */
    .tax-groups {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 28px;
    }

    .tax-group {
      background: #fdfefe;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.06);
      transition: transform 0.2s ease;
    }

    .tax-group:hover {
      transform: translateY(-4px);
    }

    .tax-group h4 {
      margin-bottom: 14px;
      font-weight: 600;
      color: #2a5298;
    }

    .drop-zone {
      border: 2px dashed #b6c2cf;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      color: #6c7a89;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .drop-zone.dragover {
      background: #eef4ff;
      border-color: #2a5298;
      color: #2a5298;
    }

    .pdf-list {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pdf-item {
      background: #f1f5fa;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    /* ================= MODAL ================= */
    #pdfModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #pdfModalContent {
      position: relative;
      width: 90%;
      max-width: 1000px;
      height: 90%;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      overflow: auto;
    }

    #pdfModalClose {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.225/pdf.min.js"></script>
</head>

<body class="dashboard-body">

  <header id="Main_header">
    Finance Dashboard
    <button id="toggleClientsBtn">Back to Clients</button>
  </header>

  <div class="finance-container">

    <!-- ================= SECTION A ================= -->
    <div class="section" id="sectionA">
      <h3>Yearly Metrics</h3>

      <label for="finance-year" style="display:block; margin-bottom:6px; font-weight:600;">
        Select Year:
      </label>
      <input type="number" id="finance-year" min="2000" max="2100" value="2026">

      <table class="metrics-table">
        <thead>
          <tr>
            <th>Year</th>
            <th>Expected Earnings</th>
            <th>Received</th>
            <th>Remaining</th>
            <th>Clients</th>
          </tr>
        </thead>
        <tbody id="metricsBody">
          <!-- Populated dynamically -->
        </tbody>
      </table>
    </div>

    <!-- ================= SECTION B ================= -->
    <div class="section" id="sectionB">
      <h3>Tax Documents</h3>

      <div class="tax-groups">

        <div class="tax-group" id="w9-group">
          <h4>W-9</h4>
          <div class="drop-zone" data-group="w9">📄 Drop PDFs Here</div>
          <div class="pdf-list" id="w9-list"></div>
        </div>

        <div class="tax-group" id="pnl-group">
          <h4>PNL</h4>
          <div class="drop-zone" data-group="pnl">📄 Drop PDFs Here</div>
          <div class="pdf-list" id="pnl-list"></div>
        </div>

        <div class="tax-group" id="1099-group">
          <h4>1099</h4>
          <div class="drop-zone" data-group="1099">📄 Drop PDFs Here</div>
          <div class="pdf-list" id="1099-list"></div>
        </div>

        <div class="tax-group" id="inference-group">
          <h4>Inference Docs</h4>
          <div class="drop-zone" data-group="inference">📄 Drop PDFs Here</div>
          <div class="pdf-list" id="inference-list"></div>
        </div>

      </div>
    </div>

  </div>

  <!-- ================= MODAL ================= -->
  <div id="pdfModal">
    <div id="pdfModalContent">
      <span id="pdfModalClose">&times;</span>
      <div id="pdfViewer"></div>
    </div>
  </div>

  <script src="finance-renderer.js" defer></script>

  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.225/pdf.worker.min.js';
    }

    document.getElementById('toggleClientsBtn')
      .addEventListener('click', () => {
        window.location.href = 'main.html';
      });
  </script>

</body>
</html>
