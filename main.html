<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: rgba(22, 65, 92, 0.92);">

    <header id="Main_header">
        Client List
    </header>
    <div class="crm-dashboard">
        <!--Left Panel : Client mangement-->
        <aside class="sidebar">
            <h2>Add New Client</h2>
            <form id = "clientIntakeForm">
                <div class="input-row">
                    <input type = "text" id = "fName" placeholder="First Name" required>
                    <input type = "text" id = "lName" placeholder="Last Name " required>
                </div>

                <input type="email" id="email" placeholder="Email Address" required>
                <input type="tel" id -= "phone" placeholder="Phone Number" required>
                <button type="submit" class="btn-primary">Add Client</button>
            </form>
            <div class="search-bar">
                <input type="text" id="searchClients" placeholder="Search Client Records... ">  
            </div>

            <ul id="clientList" class = "client-list"></ul>
        </aside>

        <!--Right panal: Project Workstation-->
        <main id="projectPanal" class="main-content">
            <div  class="welcome-screen">
                <p>Select a client on the left to manage project details</p>
            </div>
        </main>
    </div>

    <script src="renderer.js"></script>
    
</body>
</html>
