<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roofing CRM - Dashboard 2026</title>
    
    <!-- Updated 2026 Security Policy: Allows local file paths for PDFs and images -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <header id="Main_header">
        Roofing Pro CRM 2026
    </header>
    
    <div class="crm-dashboard">
        <!-- Sidebar: Lead & Client Management -->
        <aside class="sidebar">
            <h2>Add New Lead</h2>
            <form id="clientIntakeForm">
                <div class="input-row">
                    <input type="text" id="fName" placeholder="First Name" required>
                    <input type="text" id="lName" placeholder="Last Name" required>
                </div>
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="tel" id="phone" placeholder="Phone Number" required>
                <button type="submit" class="btn-primary">Add Client</button>
            </form>

            <div class="search-bar">
                <input type="text" id="searchClients" placeholder="Search name, phone, or email...">  
            </div>

            <!-- Scrollable List of Clients -->
            <ul id="clientList" class="client-list"></ul>
        </aside>

        <!-- Right panel: Interactive Project Details & PDF Drop Zone -->
        <main id="projectPanel" class="main-content">
            <div class="welcome-screen">
                <p>Select a client on the left to manage project details and documents</p>
            </div>
        </main>
    </div>

    <!-- Main Logic Script -->
    <script src="renderer.js"></script>
</body>
</html>
