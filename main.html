<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roofing CRM - Dashboard 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

  <!-- ================= HEADER ================= -->
  <header id="Main_header">Roofing Pro CRM 2026</header>

  <!-- ================= DASHBOARD GRID ================= -->
  <div class="crm-dashboard">

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">
      <h2>Add New Lead</h2>
      <form id="clientIntakeForm">
        <div class="input-row">
          <input type="text" id="fName" placeholder="First Name" required>
          <input type="text" id="lName" placeholder="Last Name" required>
        </div>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="tel" id="phone" placeholder="Phone Number" required>
        <button type="submit" class="btn-primary">Add Client</button>
      </form>

      <!-- Search Clients -->
      <div class="search-bar">
        <input type="text" id="searchClients" placeholder="Search by name, phone, or email...">
      </div>

      <!-- Scrollable Client List -->
      <ul id="clientList" class="client-list"></ul>
    </aside>

    <!-- ================= MAIN PANEL ================= -->
    <main id="projectPanel" class="main-content">
      <div class="welcome-screen">
        <p>Select a client on the left to view project details and manage documents</p>
      </div>

      <!-- Example Project Card (Dynamic content will replace this) -->

        </header>

            <button class="btn-danger delete-btn">Delete</button>
          </div>
        </div>
      </div>
      -->
    </main>

  </div>

  <script src="main-renderer.js"></script>
</body>
</html>
